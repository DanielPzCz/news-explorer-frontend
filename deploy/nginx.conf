# Configuración de nginx para servir el front-end de News Explorer.
#
# En el servidor:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/news-explorer
#   sudo ln -s /etc/nginx/sites-available/news-explorer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, para el certificado HTTPS:
#   sudo certbot --nginx -d news.around-daniel.lat

server {
    listen 80;
    listen [::]:80;

    server_name news.around-daniel.lat;

    root /var/www/news-explorer;
    index index.html;

    # Ruteo de React. La aplicación tiene rutas como /saved-news que no
    # existen como archivo en el disco: si nginx no encuentra el archivo,
    # devuelve index.html y React Router decide qué mostrar. Sin esto,
    # entrar directo a /saved-news o recargar ahí da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite compila los assets con un hash en el nombre, así que cuando
    # cambian, cambia el nombre. Se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nunca se cachea: es quien apunta a los assets nuevos
    # después de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
